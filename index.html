<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TranscriptCGEx</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07130f;
      --panel: #10231b;
      --panel-2: #163126;
      --border: #28513d;
      --text: #effff5;
      --muted: #9bb8a7;
      --accent: #35d07f;
      --danger: #ff7676;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #153a29, var(--bg) 55%);
      color: var(--text);
    }
    .container { width: min(1100px, 92%); margin: 0 auto; }
    header { padding: 28px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    h1, h2, p { margin-top: 0; }
    .brand { font-weight: 800; font-size: 22px; }
    .brand span { color: var(--accent); }
    .panel {
      background: rgba(16, 35, 27, .94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.2);
    }
    .hidden { display: none !important; }
    input, button {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font: inherit;
    }
    input { background: #091b13; color: var(--text); }
    button { background: var(--accent); color: #062012; font-weight: 800; cursor: pointer; }
    button.secondary { background: var(--panel-2); color: var(--text); }
    button.danger { background: var(--danger); color: #250606; }
    .form { display: grid; gap: 12px; max-width: 420px; margin: 50px auto; }
    .muted { color: var(--muted); }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 20px 0; }
    .toolbar button { width: auto; }
    .cards { display: grid; gap: 12px; }
    .card {
      border: 1px solid var(--border);
      background: rgba(22,49,38,.7);
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
    }
    .card:hover { border-color: var(--accent); }
    .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tag { color: var(--accent); font-size: 12px; font-weight: bold; }
    .message { border-left: 3px solid var(--accent); padding: 10px 14px; margin: 10px 0; background: #0a1b13; border-radius: 8px; }
    .error { color: var(--danger); min-height: 18px; }
    @media (max-width: 600px) { .toolbar { grid-template-columns: 1fr; } .toolbar button { width: 100%; } }
    @media print { .no-print { display: none !important; } body { background: white; color: black; } .panel { box-shadow: none; border: 0; } }
  </style>
</head>
<body>
  <header class="container no-print">
    <div class="brand">Transcript<span>CGEx</span></div>
    <button id="logoutButton" class="secondary hidden" style="width:auto">Sair</button>
  </header>

  <main class="container">
    <section id="loginView" class="panel form">
      <h1>Painel privado</h1>
      <p class="muted">Acesso às transcrições da Corregedoria.</p>
      <input id="password" type="password" placeholder="Senha do painel">
      <button id="loginButton">Entrar</button>
      <div id="loginError" class="error"></div>
    </section>

    <section id="dashboardView" class="panel hidden">
      <div class="row">
        <div>
          <h1>Transcrições da CGEx</h1>
          <p class="muted">Pesquise tickets e consulte o histórico completo.</p>
        </div>
        <button id="printButton" class="secondary no-print" style="width:auto">Imprimir / PDF</button>
      </div>

      <div class="toolbar no-print">
        <input id="search" placeholder="Pesquisar por ticket, usuário ou canal">
        <button id="searchButton">Pesquisar</button>
      </div>

      <div id="transcripts" class="cards"></div>
      <p id="listError" class="error"></p>
    </section>

    <section id="detailView" class="panel hidden">
      <div class="row no-print">
        <button id="backButton" class="secondary" style="width:auto">Voltar</button>
        <button id="detailPrintButton" style="width:auto">Exportar / PDF</button>
      </div>
      <div id="detail"></div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let currentTranscript = null;

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Erro na solicitação.");
  return data;
}

function show(view) {
  ["loginView", "dashboardView", "detailView"].forEach(id => $(id).classList.add("hidden"));
  $(view).classList.remove("hidden");
  $("logoutButton").classList.toggle("hidden", view === "loginView");
}

async function checkSession() {
  try {
    const data = await api("/api/auth/me");
    if (data.authenticated) {
      show("dashboardView");
      loadTranscripts();
    } else show("loginView");
  } catch { show("loginView"); }
}

$("loginButton").onclick = async () => {
  $("loginError").textContent = "";
  try {
    await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ password: $("password").value })
    });
    $("password").value = "";
    show("dashboardView");
    loadTranscripts();
  } catch (error) {
    $("loginError").textContent = error.message;
  }
};

$("logoutButton").onclick = async () => {
  await api("/api/auth/logout", { method: "POST" });
  show("loginView");
};

async function loadTranscripts() {
  $("listError").textContent = "";
  try {
    const query = encodeURIComponent($("search").value.trim());
    const items = await api("/api/transcripts?q=" + query);
    $("transcripts").innerHTML = "";

    if (!items.length) {
      $("transcripts").innerHTML = '<p class="muted">Nenhuma transcrição encontrada.</p>';
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="row">
          <strong>${escapeHtml(item.ticketId)}</strong>
          <span class="tag">${escapeHtml(item.status || "closed")}</span>
        </div>
        <p class="muted">${escapeHtml(item.channelName || "Canal não informado")}</p>
        <small class="muted">${item.messageCount} mensagem(ns)</small>
      `;
      card.onclick = () => loadDetail(item.id);
      $("transcripts").appendChild(card);
    });
  } catch (error) {
    $("listError").textContent = error.message;
  }
}

async function loadDetail(id) {
  try {
    currentTranscript = await api("/api/transcripts/" + encodeURIComponent(id));
    const item = currentTranscript;
    $("detail").innerHTML = `
      <h1>Ticket ${escapeHtml(item.ticketId)}</h1>
      <p class="muted">Canal: ${escapeHtml(item.channelName || "Não informado")}</p>
      <p class="muted">Abertura: ${escapeHtml(item.openedAt || "Não informado")}</p>
      <p class="muted">Encerramento: ${escapeHtml(item.closedAt || "Não informado")}</p>
      <h2>Atendentes</h2>
      <p>${(item.attendants || []).map(a => escapeHtml(a.username || a.id || "Membro")).join(", ") || "Não informado"}</p>
      <h2>Mensagens</h2>
      <div>${(item.messages || []).map(message => `
        <div class="message">
          <strong>${escapeHtml(message.authorName || message.authorId || "Usuário")}</strong>
          <div>${escapeHtml(message.content || "")}</div>
          <small class="muted">${escapeHtml(message.timestamp || "")}</small>
        </div>
      `).join("")}</div>
    `;
    show("detailView");
  } catch (error) {
    alert(error.message);
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[char]));
}

$("searchButton").onclick = loadTranscripts;
$("search").addEventListener("keydown", event => {
  if (event.key === "Enter") loadTranscripts();
});
$("backButton").onclick = () => show("dashboardView");
$("printButton").onclick = () => window.print();
$("detailPrintButton").onclick = () => window.print();

checkSession();
</script>
</body>
</html>
